query RunInput {
  discountNode {
    metafield(key: "app_discount") {
      value
      jsonValue
      type
    }
  }
  cart {
    cost {
      totalAmount {
        amount
      }
    }
    deliveryGroups {
      deliveryOptions {
        title
        handle
      }
    }
    buyerIdentity {
      isAuthenticated
      customer {
        id
        firstName
        lastName
        email
      }
    }
  }
}
