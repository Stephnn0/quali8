query RunInput {
  discountNode {
    metafield(key: "quali8_shipping_discounts") {
      value
      jsonValue
      type
    }
  }
  cart {
    cost {
      totalAmount {
        amount
      }
    }
    deliveryGroups {
      id
      deliveryOptions {
        title
        handle
        deliveryMethodType
        code
        description
        cost {
          amount
        }
      }
    }
    buyerIdentity {
      isAuthenticated
      customer {
        id
        firstName
        lastName
        email
      }
    }
  }
}
