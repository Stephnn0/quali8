query RunInput {
  discountNode {
    metafield(key: "quali8_shipping_discounts") {
      value
      jsonValue
      type
    }
  }
  cart {

    cost {
      subtotalAmount {
        amount
      }
      totalAmount {
        amount
      }
    }

    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          id
          title
          product {
            id
            title
            vendor
            inCollections {
              collectionId
            }
            hasTags {
              tag
            }
            
          }
        }
      }
    }
    deliveryGroups {
      id
      deliveryOptions {
        title
        handle
        deliveryMethodType
        code
        description
        cost {
          amount
        }
      }
    }
    buyerIdentity {
      isAuthenticated
      customer {
        id
        firstName
        lastName
        email
      }
    }
  }
}
