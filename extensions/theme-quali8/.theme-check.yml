# Theme-check settings for the app blocks. The default 10 KB JavaScript
# threshold predates blocks that render whole flows (delivery checkout,
# occasion popup); raise it so deploys don't report every block as an error.
AssetSizeAppBlockJavaScript:
  enabled: true
  threshold_in_bytes: 60000
AssetSizeAppBlockCSS:
  enabled: true
  threshold_in_bytes: 60000
