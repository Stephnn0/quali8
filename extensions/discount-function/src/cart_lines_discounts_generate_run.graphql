query CartInput($id: ID!) {
  discountNode(id: $id) {
    metafield(key: "quali8_shipping_discounts") {
      value
      jsonValue
      type
    }
  }

  cart {
    lines {
      id
      cost {
        subtotalAmount {
          amount
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
